[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding for small language models"
requires-python = ">=3.10"
dependencies = [
    "llm_sdk",
    "numpy",
    "pydantic",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pydantic>=2.14.1",
    "argparse>=1.4.0",
    "colorama>=0.4.6",
    "torch",
    "transformers",
    "huggingface-hub"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
[[tool.mypy.overrides]]
module = ["colorama", "colorama.*"]
ignore_missing_imports = true